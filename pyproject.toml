[project]
name = "m3a-agent"
version = "0.1.0"
description = "M3A: Multistep Multimodal Multiomic Agentic evaluation framework"
readme = "README.md"
requires-python = "==3.10.19"

# Direct dependencies of the harness and of every tool category used by the
# configs (scselected_scrna/scatac/multiome, external_database, external_literature,
# external_support_tools). Pinned to the versions in the environment the
# published runs used; uv.lock pins every transitive dependency (with hashes).
dependencies = [
    # LLM providers + observability
    "anthropic==0.79.0",
    "openai==2.20.0",
    "wandb==0.25.0",
    "weave==0.52.26",
    # Harness
    "pyyaml==6.0.3",
    "questionary==2.1.1",
    "nbformat==5.10.4",
    "pillow==12.1.1",
    # Single-cell stack
    "numpy==1.26.4",
    "scipy==1.15.3",
    "pandas==2.1.1",
    "anndata==0.10.9",
    "scanpy==1.11.5",
    "snapatac2==2.8.0",
    "macs3==3.0.3",
    "cnmf==1.7.0",
    "harmonypy==0.2.0",
    "infercnvpy==0.6.1",
    "scikit-learn==1.7.2",
    "leidenalg==0.11.0",
    "igraph==1.0.0",
    "numba==0.63.1",
    # Plotting
    "matplotlib==3.10.8",
    "seaborn==0.13.2",
    "plotly==5.24.1",
    # kaleido 1.x is incompatible with plotly 5.x (fig.write_image fails);
    # 0.2.1 is the release that works with plotly 5.24.
    "kaleido==0.2.1",
    # Literature / database tools
    "requests==2.32.5",
    "beautifulsoup4==4.14.3",
    "biopython==1.86",
    "arxiv==2.4.0",
    "pymed==0.8.9",
    "scholarly==1.7.11",
    "googlesearch-python==1.3.0",
    "PyPDF2==3.0.1",
    # run_terminal uses pip (uv venvs ship without it); installed packages stay pinned
    "pip==26.0.1",
]

[project.optional-dependencies]
# scvi-based tools in tool_scselected (not installed in the original env)
scvi = [
    "scvi-tools",
]

[tool.uv]
package = false
required-version = ">=0.13.9"
python-preference = "only-managed"
# Transitive dependencies pinned to the versions of the original (conda) research
# environment, so the locked env matches it for every package the two share.
# Packages only pulled in by optional extras (e.g. scvi) are resolved freely.

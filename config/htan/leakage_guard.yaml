# Shared settings for every HTAN config (via `extends:`); keys in a task config override these.
# They keep the agent away from the answers. With `leakage_guard: true` a run refuses to start
# unless all of the protections below are in place (src/config.py: check_leakage_guard).
#
# - The tool worker runs in the lab runtime container. It mounts only src/ (no configs, tasks,
#   outputs, data disk or .git), the task's own input files (at neutral paths under /inputs),
#   and the run directory.
# - The worker has no network. Literature and database tools run in the harness process instead,
#   so agent-written code (REPL / terminal) cannot download anything.
# - Run directories are output/runs/<random id>, so the working directory does not name the
#   cohort or task. A pointer file (run_<time>_<id>.json) goes to the config's output_base_dir.
# - Literature tools filter the source study, the papers citing it, its code repositories and
#   their forks (generated by scripts/make_literature_blacklist.py).
#   Results of the harness-side tools that mention a blacklisted work, accession, URL or title are
#   withheld (database tools such as query_geo do not filter by themselves).
# - Tools that reach HTAN releases (Synapse) or TCGA endpoint data (cBioPortal) are not offered, nor
#   advanced_web_search_claude: it reads pages server-side, so its answers cannot be filtered.
# - /app is hidden from the worker (v2 kept build files and registry credentials there; v3 has no /app).
leakage_guard: true
anonymous_run_dir: true
anonymous_run_root: output/runs
literature_blacklist_file: config/htan/literature_blacklist.yaml
exclude_tools: [query_synapse, download_synapse_data, query_cbioportal, advanced_web_search_claude]
execution:
  mode: container
  container:
    runtime: docker
    image: ghcr.io/vanallenlab/agentic-sc-runtime:v3   # built from docker/runtime/ (tested with every HTAN tool)
    mount: code
    mask_paths: [/app]
    network: false
    memory: 24g        # this VM has 29 GB; leave room for the harness
    cpus: 8

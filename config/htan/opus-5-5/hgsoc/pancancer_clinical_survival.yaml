# Same task and inputs as config/htan/opus-4-6/hgsoc/pancancer_clinical_survival.yaml, model Claude Opus 5.5.
extends: config/htan/leakage_guard.yaml
task_file: tasks/htan/hgsoc/pancancer_clinical_survival.md
scrna_data_path: data/datasets-mt/htan_datasets/results/scrna/OV/final_combined_adata_OV_with_cancertype_sitetype_celltype.h5ad
scatac_data_path: data/datasets-mt/htan_datasets/results/scatac/OV/final_combined_adata_OV_with_cancertype_sitetype_celltype.h5ad
scatac_snap_path: data/datasets-mt/htan_datasets/results/scatac/OV/final_combined_adata_OV_backed.h5ad
# data_dir: data/datasets-mt/htan_datasets/results/OV
cnmf_usage_path: data/datasets-mt/htan_datasets/results/cnmf/OV/Tumor/usage.csv
cnmf_spectra_scores_path: data/datasets-mt/htan_datasets/results/cnmf/OV/Tumor/spectra_scores.csv
cnmf_top_genes_path: data/datasets-mt/htan_datasets/results/cnmf/OV/Tumor/top_genes.csv
tool_category: scselected_scrna, scselected_scatac, scselected_multiome, external_database
reasoning_effort: medium
interactive: false
capture_telemetry: true
output_base_dir: output/opus-5-5/hgsoc/pancancer_clinical_survival/

llm:
  provider: anthropic
  model: claude-opus-5-5
  prompt_caching: true
  max_tokens: 64000
  effort: medium
  thinking_display: summarized
  cache_keepalive_minutes: 30   # keep the prompt cache alive through tool calls up to 30 min
logging:
  enabled: true
  project: agentic-ai-htan-v2
  entity: vanallenlab-agentic-ai
  run_name: null  # auto-generated if null
